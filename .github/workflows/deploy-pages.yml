name: Deploy to GitHub Pages

# Buildless: ES-Module werden direkt ausgeliefert, es gibt keinen Build-Schritt.
# Der Workflow prüft die Abnahme-Checks und lädt dann das Repo-Root hoch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # naga (der WGSL-Übersetzer aus wgpu) als WASM — echter Compile-Check des
      # Shaders. Ohne ihn ist check-wgsl.js reine Textvergleichung: ein
      # `let cnt`, das in einer Schleife dekrementiert wird, parst dort fine
      # und crasht erst im Browser des Benutzers. --no-save: das Repo bleibt
      # buildless und ohne package.json, die Abhängigkeit lebt nur in der CI.
      - name: WGSL-Compiler holen (naga-wasm, optional für lokal)
        run: npm i --no-save naga-wasm@30.2.0
      # Die Check-Zahl steht NUR im Harness selbst (build-stamps pinnt den
              Viewer-Text dagegen) — ein zweiter harter Zähler hier war schon einmal veraltet.
      - name: Abnahme-Checks
        run: node tools/harness.js
      - name: Shader-Compile explizit
        run: node tools/compile-wgsl.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Artefakt vorbereiten
        run: |
          mkdir -p site
          cp -r index.html gpu.html gpu-min.html train.html .nojekyll src genomes site/
          test -f site/index.html || (echo "::error::index.html fehlt" && exit 1)
          test -f site/gpu.html || (echo "::error::gpu.html fehlt" && exit 1)
          test -f site/gpu-min.html || (echo "::error::gpu-min.html fehlt" && exit 1)
          test -f site/train.html || (echo "::error::train.html fehlt" && exit 1)
          test -f site/genomes/walker-crn-s1.json || (echo "::error::Walker-Genom fehlt" && exit 1)
          test -f site/src/gpu/solver.wgsl || (echo "::error::Shader fehlt" && exit 1)
          test -f site/src/sim/core.js || (echo "::error::src/sim/core.js fehlt" && exit 1)
          test -f site/src/sim/gputrain.js || (echo "::error::src/sim/gputrain.js fehlt" && exit 1)
          test -f site/.nojekyll || touch site/.nojekyll
          echo "Site-Inhalt:"; find site -type f | sort
      - name: Cache-Busting (eindeutige Modul-URLs pro Deploy)
        # Jede .js- und .wgsl-URL im Artefakt bekommt ?v=<sha>. Damit kann weder
        # ein Browser-Cache noch eine CDN-Edge jemals eine alte Datei zu einer
        # neuen HTML liefern — genau das hatte zuvor einen Crash an einer
        # Zeilennummer produziert, die es im aktuellen Build nicht mehr gab.
        run: node tools/bust-cache.js site "${{ github.sha }}"

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
