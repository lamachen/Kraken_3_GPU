name: Deploy to GitHub Pages

# Buildless: ES-Module werden direkt ausgeliefert, es gibt keinen Build-Schritt.
# Der Workflow prüft die Abnahme-Checks und lädt dann das Repo-Root hoch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Abnahme-Checks (22)
        run: node tools/harness.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Artefakt vorbereiten
        run: |
          mkdir -p site
          cp -r index.html gpu.html gpu-min.html .nojekyll src site/
          test -f site/index.html || (echo "::error::index.html fehlt" && exit 1)
          test -f site/gpu.html || (echo "::error::gpu.html fehlt" && exit 1)
          test -f site/gpu-min.html || (echo "::error::gpu-min.html fehlt" && exit 1)
          test -f site/src/gpu/solver.wgsl || (echo "::error::Shader fehlt" && exit 1)
          test -f site/src/sim/core.js || (echo "::error::src/sim/core.js fehlt" && exit 1)
          test -f site/.nojekyll || touch site/.nojekyll
          echo "Site-Inhalt:"; find site -type f | sort
      - name: Cache-Busting (eindeutige Modul-URLs pro Deploy)
        # Jede .js- und .wgsl-URL im Artefakt bekommt ?v=<sha>. Damit kann weder
        # ein Browser-Cache noch eine CDN-Edge jemals eine alte Datei zu einer
        # neuen HTML liefern — genau das hatte zuvor einen Crash an einer
        # Zeilennummer produziert, die es im aktuellen Build nicht mehr gab.
        run: node tools/bust-cache.js site "${{ github.sha }}"

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
